<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Portfolio</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Manrope:wght@400..700&display=swap">
<style>
:root{--serif:"Fraunces",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--paper:#fff8ee;--ink:#14232b;--muted:#56656b;--line:#eddcc4;--teal:#0f7c8c;--teal-2:#16a0aa;--tang:#f26a2e;--sun:#ffc93c;--danger:#c2410c;
--glass:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.38));--edge:rgba(255,255,255,.8);--shadow:0 14px 34px rgba(20,35,43,.1),inset 0 1px 0 #fff;--tint:linear-gradient(135deg,rgba(15,124,140,.96),rgba(22,160,170,.88));--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:450 15px/1.55 var(--sans);color:var(--ink);background:radial-gradient(50vw 45vh at 0% 0%,rgba(15,124,140,.16),transparent 62%),radial-gradient(45vw 50vh at 100% 20%,rgba(255,122,61,.14),transparent 62%),radial-gradient(60vw 50vh at 50% 100%,rgba(255,201,60,.2),transparent 64%),var(--paper);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:22px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--edge);border-radius:999px;padding:10px 18px;font-weight:650;font-size:13.5px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(20,35,43,.06);transition:transform .25s var(--ease),background .25s,color .25s,opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--tint);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(15,124,140,.28)}
.btn.accent{background:linear-gradient(135deg,var(--tang),#ff8f4f);color:#fff;border-color:rgba(255,255,255,.3)}
.btn.ghost-danger{color:var(--danger)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:rgba(255,255,255,.75);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(15,124,140,.12);outline:none}
textarea{min-height:130px;resize:vertical}
[hidden]{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(420px,100%);padding:38px 34px}
.login h1{font-size:38px;margin:6px 0 6px}.login p{color:var(--muted);margin:0 0 26px}
.login .field{margin-bottom:16px}.login .btn{width:100%;padding:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tang)}
.error{color:var(--danger);font-weight:600;font-size:13.5px;min-height:20px;margin:8px 0 0}

/* app */
.top{position:sticky;top:10px;z-index:20;margin:10px 14px 0;padding:10px 12px 10px 22px;display:flex;align-items:center;gap:12px;border-radius:999px}
.top .brand{font:500 19px var(--serif);margin-right:auto;white-space:nowrap}.top .brand span{font:700 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--tang);margin-left:8px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;max-width:1380px;margin:22px auto 80px;padding:0 18px}
.side{position:sticky;top:96px;align-self:start;padding:16px;max-height:calc(100vh - 116px);overflow:auto}
.side h3{font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
.side button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:14px;font-weight:600;font-size:14px;transition:background .2s}
.side button:hover{background:rgba(255,255,255,.7)}.side button[aria-current=true]{background:var(--tint);color:#fff}
.side button small{opacity:.7;font-weight:600}
.mobile-pick{display:none}
.main{display:grid;gap:22px;min-width:0}
.card{padding:26px 28px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.card-head h2{font-size:30px}.card-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.langs{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--edge)}
.langs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:12.5px;letter-spacing:.06em}
.langs button[aria-pressed=true]{background:var(--tint);color:#fff}
.fields{display:grid;gap:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.dirty{font-size:12.5px;color:var(--tang);font-weight:700}

/* photos */
.drop{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;border:2px dashed rgba(15,124,140,.35);border-radius:20px;padding:26px;background:rgba(255,255,255,.45);transition:background .2s,border-color .2s;cursor:pointer}
.drop.over{background:rgba(255,201,60,.18);border-color:var(--tang)}.drop strong{font-size:15px}.drop span{color:var(--muted);font-size:13px}
.queue{display:grid;gap:8px;margin:12px 0 0}.queue div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:20px;align-items:start}
.tile{position:relative;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.65);border:1px solid var(--edge);box-shadow:0 8px 20px rgba(20,35,43,.07);display:flex;flex-direction:column}
.tile .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#f3e6d3;cursor:grab;touch-action:none}.tile .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
.tile .num{position:absolute;left:10px;top:10px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.85)}
.tile .del{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.85);color:var(--danger);font-size:16px;display:grid;place-items:center}
.tile .body{padding:10px;display:grid;gap:8px}
.tile input{padding:8px 10px;font-size:13px;border-radius:10px}
.tile .more{border:0;background:transparent;color:var(--teal);font-weight:700;font-size:12px;text-align:left;padding:0}
.tile .langs-more{display:grid;gap:6px}
.sortable-ghost{opacity:.35}.sortable-chosen .thumb{cursor:grabbing}.sortable-drag{transform:rotate(2deg);box-shadow:0 24px 50px rgba(20,35,43,.25)!important}
.empty{color:var(--muted);text-align:center;padding:30px}

.toast{position:fixed;left:50%;bottom:22px;z-index:60;transform:translate(-50%,20px);opacity:0;padding:12px 20px;border-radius:999px;font-weight:700;font-size:13.5px;color:#fff;background:var(--tint);box-shadow:0 12px 30px rgba(20,35,43,.25);transition:opacity .3s,transform .4s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:linear-gradient(135deg,#c2410c,#ea580c)}

@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.mobile-pick{display:block;padding:14px 16px}.card{padding:20px}.card-head h2{font-size:25px}.top{border-radius:22px}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.top .brand span{display:none}.top .btn{padding:9px 13px}}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="glass" id="login-form" autocomplete="on">
    <div class="eyebrow">Portfolio</div>
    <h1>Administration</h1>
    <p>Connectez-vous pour modifier les projets et les photos.</p>
    <div class="field"><label for="user">Identifiant</label><input type="text" id="user" name="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Mot de passe</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" id="login-btn">Se connecter</button>
    <p class="error" id="login-error" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top glass">
    <div class="brand">Mohamed Ali Touihri<span>Admin</span></div>
    <a class="btn" href="/" target="_blank" rel="noopener">Voir le site ↗</a>
    <button class="btn" id="logout">Déconnexion</button>
  </header>
  <div class="layout">
    <nav class="side glass" id="side" aria-label="Projets"></nav>
    <main class="main">
      <div class="mobile-pick glass"><label for="project-select">Projet</label><select id="project-select"></select></div>

      <section class="card glass" aria-labelledby="text-title">
        <div class="card-head">
          <div><h2 id="text-title">Texte du projet</h2><p id="text-sub"></p></div>
          <div class="langs" role="group" aria-label="Langue">
            <button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="de" aria-pressed="false">DE</button>
          </div>
        </div>
        <div class="fields">
          <div><label for="f-title">Titre</label><input type="text" id="f-title" maxlength="200"></div>
          <div><label for="f-desc">Description</label><textarea id="f-desc" maxlength="4000"></textarea></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="save-text">Enregistrer le texte</button>
          <button class="btn accent" id="translate-text" title="Remplit l’anglais et l’allemand à partir du français">Traduire FR → EN + DE</button>
          <span class="dirty" id="dirty" hidden>Modifications non enregistrées</span>
        </div>
      </section>

      <section class="card glass" aria-labelledby="photos-title">
        <div class="card-head">
          <div><h2 id="photos-title">Photos</h2><p>Glissez-déposez les photos pour changer l’ordre — il est enregistré automatiquement.</p></div>
        </div>
        <label class="drop" id="drop" for="file">
          <strong>＋ Ajouter des photos</strong>
          <span>Cliquez ou déposez des images ici (JPEG, PNG, WebP). Elles sont compressées avant l’envoi.</span>
        </label>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <div class="queue" id="queue"></div>
        <div class="grid" id="grid"></div>
      </section>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script>
(() => {
  const CATEGORIES = { 'travaux-publics': 'Travaux publics', 'construction-neuve': 'Construction neuve', 'renovation-amenagement': 'Rénovation & aménagement', 'industriel': 'Industriel & charpente' };
  const $ = (s) => document.querySelector(s);
  const state = { projects: [], current: null, lang: 'fr', draft: null, dirty: false };
  const url = (src) => (/^(https?:)?\//.test(src) ? src : '/' + src);

  // ---------- helpers
  let toastTimer;
  function toast(msg, err) {
    const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), err ? 4200 : 2200);
  }
  async function api(path, opts = {}) {
    const res = await fetch(path, { credentials: 'same-origin', ...opts, headers: opts.body instanceof FormData ? {} : { 'content-type': 'application/json', ...(opts.headers || {}) } });
    let data = null; try { data = await res.json(); } catch {}
    if (res.status === 401 && !path.startsWith('/api/auth')) { showLogin(); throw new Error('Session expirée, reconnectez-vous.'); }
    if (!res.ok && !data) throw new Error(`L’administration ne fonctionne pas à cette adresse (erreur ${res.status}). Ouvrez https://portfolio-mohamed-ali-touihri.pages.dev/admin`);
    if (!res.ok) throw new Error((data && data.error) || `Erreur ${res.status}`);
    return data;
  }
  const el = (tag, props = {}, ...children) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...children); return e; };

  // ---------- auth
  function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#user').focus(); }
  async function start() {
    try {
      const me = await api('/api/auth/me');
      if (me.configured === false) { showLogin(); $('#login-error').textContent = 'L’administration n’est pas encore configurée sur le serveur.'; return; }
      if (!me.authenticated) return showLogin();
      await loadApp();
    } catch (e) { showLogin(); $('#login-error').textContent = e.message; }
  }
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = $('#login-btn'); btn.disabled = true; $('#login-error').textContent = '';
    try {
      await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ user: $('#user').value, password: $('#password').value }) });
      $('#password').value = ''; await loadApp();
    } catch (err) { $('#login-error').textContent = err.message; } finally { btn.disabled = false; }
  });
  $('#logout').addEventListener('click', async () => {
    if (state.dirty && !confirm('Des modifications ne sont pas enregistrées. Se déconnecter quand même ?')) return;
    await api('/api/auth/logout', { method: 'POST' }).catch(() => {}); state.dirty = false; showLogin();
  });

  // ---------- projects
  async function loadApp() {
    const data = await api('/api/admin/content');
    state.projects = data.projects;
    $('#login').hidden = true; $('#app').hidden = false;
    renderNav();
    const keep = state.current && state.projects.find((p) => p.id === state.current.id);
    select((keep || state.projects[0]).id, true);
  }
  function renderNav() {
    const side = $('#side'); side.replaceChildren(); const sel = $('#project-select'); sel.replaceChildren();
    for (const [cat, label] of Object.entries(CATEGORIES)) {
      const list = state.projects.filter((p) => p.category === cat); if (!list.length) continue;
      side.append(el('h3', { textContent: label }));
      const group = el('optgroup', { label });
      for (const p of list) {
        const b = el('button', { type: 'button' }, el('span', { textContent: p.title.fr }), el('small', { textContent: p.photos.length }));
        b.dataset.id = p.id; b.addEventListener('click', () => select(p.id)); side.append(b);
        group.append(el('option', { value: p.id, textContent: `${p.title.fr} (${p.photos.length})` }));
      }
      sel.append(group);
    }
    markNav();
  }
  function markNav() {
    document.querySelectorAll('#side button').forEach((b) => b.setAttribute('aria-current', String(state.current && b.dataset.id === state.current.id)));
    if (state.current) $('#project-select').value = state.current.id;
  }
  $('#project-select').addEventListener('change', (e) => select(e.target.value));
  function select(id, force) {
    if (!force && state.current && id === state.current.id) return;
    if (state.dirty && !confirm('Le texte de ce projet n’est pas enregistré. Changer de projet quand même ?')) { markNav(); return; }
    state.current = state.projects.find((p) => p.id === id);
    state.draft = { title: { ...state.current.title }, desc: { ...state.current.desc } };
    setDirty(false); setLang(state.lang); renderPhotos(); markNav();
    $('#text-sub').textContent = `${CATEGORIES[state.current.category] || ''} · ${state.current.photos.length} photos`;
  }

  // ---------- text editor
  function setDirty(v) { state.dirty = v; $('#dirty').hidden = !v; }
  function setLang(lang) {
    state.lang = lang;
    document.querySelectorAll('.langs [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('#f-title').value = state.draft.title[lang] || ''; $('#f-desc').value = state.draft.desc[lang] || '';
    $('#f-title').placeholder = lang === 'fr' ? '' : state.draft.title.fr; $('#f-desc').placeholder = lang === 'fr' ? '' : state.draft.desc.fr;
  }
  document.querySelectorAll('.langs [data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#f-title').addEventListener('input', (e) => { state.draft.title[state.lang] = e.target.value; setDirty(true); });
  $('#f-desc').addEventListener('input', (e) => { state.draft.desc[state.lang] = e.target.value; setDirty(true); });
  $('#save-text').addEventListener('click', async () => {
    const btn = $('#save-text'); btn.disabled = true;
    try {
      const r = await api(`/api/admin/projects/${encodeURIComponent(state.current.id)}`, { method: 'PUT', body: JSON.stringify(state.draft) });
      state.current.title = r.title; state.current.desc = r.desc; state.draft = { title: { ...r.title }, desc: { ...r.desc } };
      setDirty(false); renderNav(); toast('Texte enregistré ✓');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });
  async function translate(fr) { return fr.trim() ? api('/api/admin/translate', { method: 'POST', body: JSON.stringify({ text: fr }) }) : { en: '', de: '' }; }
  $('#translate-text').addEventListener('click', async () => {
    const btn = $('#translate-text'); btn.disabled = true; btn.textContent = 'Traduction…';
    try {
      const [t, d] = await Promise.all([translate(state.draft.title.fr), translate(state.draft.desc.fr)]);
      for (const l of ['en', 'de']) { state.draft.title[l] = t[l]; state.draft.desc[l] = d[l]; }
      setDirty(true); setLang(state.lang === 'fr' ? 'en' : state.lang); toast('Traduit — vérifiez puis enregistrez');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.textContent = 'Traduire FR → EN + DE'; }
  });
  addEventListener('beforeunload', (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- photos
  let sortable;
  function renderPhotos() {
    const grid = $('#grid'); grid.replaceChildren();
    const photos = state.current.photos;
    $('#photos-title').textContent = `Photos (${photos.length})`;
    if (!photos.length) grid.append(el('p', { className: 'empty', textContent: 'Aucune photo pour ce projet.' }));
    photos.forEach((ph, i) => grid.append(tile(ph, i)));
    if (sortable) sortable.destroy();
    sortable = Sortable.create(grid, { animation: 220, easing: 'cubic-bezier(.2,.7,.2,1)', handle: '.thumb', delay: 120, delayOnTouchOnly: true, onEnd: saveOrder });
  }
  function tile(ph, i) {
    const caption = el('input', { type: 'text', value: ph.caption.fr || '', placeholder: 'Légende (FR)', maxLength: 300 });
    const en = el('input', { type: 'text', value: ph.caption.en || '', placeholder: 'Caption (EN)', maxLength: 300 });
    const de = el('input', { type: 'text', value: ph.caption.de || '', placeholder: 'Bildunterschrift (DE)', maxLength: 300 });
    const tr = el('button', { type: 'button', className: 'btn accent', textContent: 'Traduire' }); tr.style.padding = '7px 12px';
    const more = el('div', { className: 'langs-more', hidden: true }, en, de, tr);
    const toggle = el('button', { type: 'button', className: 'more', textContent: 'EN / DE ▾' });
    toggle.addEventListener('click', () => { more.hidden = !more.hidden; toggle.textContent = more.hidden ? 'EN / DE ▾' : 'EN / DE ▴'; });
    const save = async () => {
      const next = { fr: caption.value.trim(), en: en.value.trim(), de: de.value.trim() };
      if (next.fr === ph.caption.fr && next.en === ph.caption.en && next.de === ph.caption.de) return;
      try { const r = await api(`/api/admin/photos/${ph.id}`, { method: 'PATCH', body: JSON.stringify({ caption: next }) }); ph.caption = r.caption; toast('Légende enregistrée ✓'); }
      catch (e) { toast(e.message, true); }
    };
    [caption, en, de].forEach((inp) => { inp.addEventListener('change', save); inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); }); });
    tr.addEventListener('click', async () => {
      tr.disabled = true; try { const r = await translate(caption.value); en.value = r.en; de.value = r.de; await save(); } catch (e) { toast(e.message, true); } finally { tr.disabled = false; }
    });
    const del = el('button', { type: 'button', className: 'del', title: 'Supprimer la photo', textContent: '✕' });
    del.setAttribute('aria-label', 'Supprimer la photo');
    del.addEventListener('click', async () => {
      if (!confirm('Supprimer définitivement cette photo du portfolio ?')) return;
      try {
        await api(`/api/admin/photos/${ph.id}`, { method: 'DELETE' });
        state.current.photos = state.current.photos.filter((p) => p.id !== ph.id); renderPhotos(); renderNav(); toast('Photo supprimée');
      } catch (e) { toast(e.message, true); }
    });
    const img = el('img', { src: url(ph.src), alt: ph.caption.fr || '', loading: 'lazy', draggable: false });
    const node = el('div', { className: 'tile' }, el('div', { className: 'thumb', title: 'Glisser pour déplacer' }, img, el('span', { className: 'num', textContent: i + 1 })), del, el('div', { className: 'body' }, caption, toggle, more));
    node.dataset.id = ph.id;
    return node;
  }
  async function saveOrder() {
    const ids = [...document.querySelectorAll('#grid .tile')].map((t) => Number(t.dataset.id));
    const before = state.current.photos;
    state.current.photos = ids.map((id) => before.find((p) => p.id === id));
    document.querySelectorAll('#grid .tile .num').forEach((n, i) => { n.textContent = i + 1; });
    try { await api(`/api/admin/projects/${encodeURIComponent(state.current.id)}/order`, { method: 'PUT', body: JSON.stringify({ ids }) }); toast('Ordre enregistré ✓'); }
    catch (e) { state.current.photos = before; renderPhotos(); toast(e.message, true); }
  }

  // ---------- uploads (resized in the browser before sending)
  async function compress(file) {
    const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
    let max = 2000, quality = 0.84, blob;
    for (let attempt = 0; attempt < 6; attempt++) {
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas'); canvas.width = Math.round(bitmap.width * scale); canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      blob = await new Promise((r) => canvas.toBlob(r, 'image/webp', quality));
      if (!blob || blob.type !== 'image/webp') blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
      if (blob.size <= 1_800_000) break;
      max = Math.round(max * 0.8); quality = Math.max(0.6, quality - 0.06);
    }
    return blob;
  }
  async function upload(files) {
    const project = state.current; const queue = $('#queue');
    for (const file of files) {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { toast(`${file.name} : format non pris en charge`, true); continue; }
      const row = el('div', {}, el('span', { textContent: file.name }), el('strong', { textContent: 'Compression…' })); queue.append(row);
      try {
        const blob = await compress(file);
        row.lastChild.textContent = 'Envoi…';
        const fd = new FormData(); fd.append('file', blob, file.name.replace(/\.[^.]+$/, '') + (blob.type === 'image/webp' ? '.webp' : '.jpg'));
        fd.append('caption_fr', project.title.fr); fd.append('caption_en', project.title.en || ''); fd.append('caption_de', project.title.de || '');
        const r = await api(`/api/admin/projects/${encodeURIComponent(project.id)}/photos`, { method: 'POST', body: fd });
        project.photos.push(r.photo); row.lastChild.textContent = '✓';
        if (state.current === project) renderPhotos();
      } catch (e) { row.lastChild.textContent = '✕ ' + e.message; toast(e.message, true); }
      setTimeout(() => row.remove(), 2500);
    }
    renderNav(); toast('Photos ajoutées ✓');
  }
  $('#file').addEventListener('change', (e) => { upload([...e.target.files]); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); drop.classList.add('over'); } }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
  drop.addEventListener('drop', (e) => { e.preventDefault(); upload([...e.dataTransfer.files]); });

  start();
})();
</script>
</body>
